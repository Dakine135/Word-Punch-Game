# Word lists from the kids' school sheets ("Heart Words").
# Levels are played in `order`. `points` is the base score for breaking a word at that level.
# Letters are generated in code (A-Z, a-z); their spoken aliases live in [letters] below.

order = ["letters", "k1", "k2", "k3", "k4", "g1q1", "g1q2", "g1q3", "g1q4",
         "g2a", "g2b", "g3a", "g3b", "g4", "g5", "g6", "g7", "g8", "g9", "g10", "g11", "g12",
         "college", "masters", "doctorate"]

# Words that sound the same. Hearing any member counts for every member,
# and the spawner never puts two members of a group on screen at once.
homophones = [
  ["to", "two", "too"],
  ["one", "won"],
  ["there", "their", "they're"],
  ["right", "write"],
  ["no", "know"],
  ["for", "four"],
  ["our", "hour"],
  ["by", "buy", "bye"],
  ["son", "sun"],
  ["here", "hear"],
  ["where", "wear"],
  ["i", "eye"],
  ["be", "bee"],
  ["so", "sew"],
  ["would", "wood"],
  ["read", "red", "reed"],
  ["some", "sum"],
  ["through", "threw"],
  ["were", "we're"],
  ["a", "uh"],          # kids (and grown-ups) usually say "a" as "uh"
  ["eight", "ate"],
  ["night", "knight"],
  ["rain", "reign", "rein"],
  ["weather", "whether"],
  ["allusion", "illusion"],
  ["muscle", "mussel"],
]


[levels.letters]
name = "Letters"
points = 5
words = []  # filled with A-Z and a-z at load time

[levels.k1]
name = "K - Q1"
points = 10
# The school list also has "a" and "I", but one-letter words are too short for the speech
# recognizer to hear reliably, so they're left out of the game.
words = ["the", "is"]

[levels.k2]
name = "K - Q2"
points = 15
words = ["to", "he", "me", "we", "be", "my", "you", "she", "was", "said", "are", "have"]

[levels.k3]
name = "K - Q3"
points = 20
words = ["of", "do", "go", "so", "no", "and", "for", "one", "two", "what", "all", "your",
         "from", "they", "some", "here"]

[levels.k4]
