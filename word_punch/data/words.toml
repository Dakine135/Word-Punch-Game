# ---- Added for older kids (nieces). Grades 2-3: Dolch sight words (public domain, Dolch
# 1936/1948) minus words already on the K/1st school lists, plus phonics-pattern words.
# Grades 4-12: our own lists following common spelling/vocabulary sequences (prefixes and
# suffixes -> drop-e/change-y, -tion -> Greek/Latin roots -> -ance/-ence, -ious -> academic
# and SAT-style words in high school).

