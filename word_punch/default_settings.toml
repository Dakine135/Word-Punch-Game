# Defaults. Override any of these in settings.toml at the project root
# (same structure; only include what you change).

[camera]
index = "auto"       # "auto" = USB webcam if plugged in, else built-in; or a number to force one
name = ""            # prefer a camera whose name contains this, e.g. "C270"
exposure = "auto"    # or a number: webcams drop to ~15 fps in dim rooms on auto. On Windows,
                     # -5 = 1/32 s (30 fps, darker), -4 = 1/16 s. More light in the room = faster.
# 16:9 like the screen, so nothing gets cropped. Many webcams (the C270 included) show a
# narrower, zoomed-in view at 640x480; 640x360 shows the sensor's full width.
width = 640
height = 360
fps = 30

[pose]
# YOLO11-pose on the GPU: steadier (1.3 vs 9.7 px/frame wobble), finds the player every frame,
# and tracks each kid with an ID so players don't get jumbled. "mediapipe" = old CPU model.
backend = "yolo"
yolo_model = "models/yolo11x-pose.pt"   # n / s / m / l / x (x: ~16 ms per frame on the RTX 4080)
yolo_imgsz = 640
yolo_conf = 0.35
mediapipe_model = "models/pose_landmarker_full.task"
smoothing = "low"        # off / low / medium / high - steadier skeletons, hats and hand rings
gesture_model = "models/gesture_recognizer.task"   # open palm vs fist, for menu clicks
max_people = 3
input_width = 480    # frame is downscaled to this width before pose detection
min_detection_confidence = 0.5
min_presence_confidence = 0.5
min_tracking_confidence = 0.5

[punch]
window_s = 0.35          # look back this far for the punch motion
min_rise = 0.9           # wrist must rise this many shoulder-widths within the window
min_speed = 3.5          # ...at this many shoulder-widths per second
above_shoulder = true    # and end above shoulder height
cooldown_s = 0.4
min_visibility = 0.4
slice_speed = 5.0        # slice mode: hand speed (shoulder-widths per second) that counts as a swipe

[speech]
engine = "vosk"          # vosk (fast, listens for the on-screen words) | choice (Whisper picks the on-screen word)
second_opinion = true    # when Vosk hears a voice but can't place it, Whisper (GPU) picks the on-screen word
choice_model = "openai/whisper-large-v3-turbo"
choice_floor = -2.0      # Whisper's confidence cutoff: -1.6 stricter, -2.5 looser (more hits, more false alarms)
# The bigger model hears kids' voices much better (child-pitched test: 85% -> 96%).
# The small one is faster - use it on a Raspberry Pi if the big one is too slow.
model = "models/vosk-model-en-us-0.22-lgraph"
# model = "models/vosk-model-small-en-us-0.15"
device = ""              # mic name substring; "" = system default
sample_rate = 16000
use_partials = true      # react to words before the kid stops talking (faster, a bit less sure)
min_confidence = 0.0     # drop final words below this confidence (0..1)
grammar = "screen"       # "screen" = listen only for words on screen (best); "level" = all words in play
voice_level = 0.45       # mic level (0..1) that counts as someone speaking
save_misses = false      # save speech it couldn't place to logs/audio/ (for tuning to the kids' voices)

[menu]
select = "palm"          # "palm" = raise a hand over a button and open your palm; "hover" = hold a hand still
palm_hold_s = 0.4        # how long an open palm must stay on a button

[game]
width = 1280
height = 720
fullscreen = false
fps = 60
vsync = false        # true can smooth tearing, but made some laptops drop to ~18 fps
volume = 100         # sound effects, 0-100
music = 35           # background music, 0-100
debug = false        # show fps / camera / mic info (F3 toggles)
skeletons = true     # draw each player's body skeleton over the camera

[voice]
enabled = true
model = "models/en_US-lessac-medium.onnx"
volume = 100
slowness = 1.15          # >1 speaks a little slower (good for kids)
read_missed = true       # read a word aloud when it's missed

[rules]
lives = 3                # per lane in split mode, shared in co-op / competitive
round_end = "time"       # "time" = after round_minutes, "words" = after round_words words,
                         # "level" = when the level is mastered, "lives" = until lives run out
round_words = 15         # per kid (co-op: per kid, added together; race: first to this many wins)
round_minutes = 3
style = "punch"          # "punch" = fist rockets, "slice" = swipe through the words
powerups = true          # golden (x2), freeze (5 s) and giant (10 s) words
powerup_chance = 0.12
gentle = false           # true = no lives; missed words bounce back and get read aloud
mastery_hits = 2         # read every word on the level this many times in one session, without
                         # losing a life -> the profile moves up a level
mastery_read_s = 4.0     # a read only counts toward mastery if it's this fast
review_chance = 0.25     # chance a word comes from earlier levels (review)
review_depth = 3         # review only from this many levels just before the current one
letters_easy = false     # true = any sound unlocks a lane's only letter (for the littlest)
rocket_from = "bottom"   # "bottom" = fist rocket launches from the floor at the fist's x; "fist" = from the fist

[difficulty]
start_fall = 0.055       # fraction of screen height per second (~18 s to fall)
min_fall = 0.025         # slowest it can go (~40 s to fall)
max_fall = 0.20
start_interval = 3.5     # seconds between new words in a lane
min_interval = 1.2
max_interval = 5.0
max_on_screen = 3        # per lane, at the slowest speed
extra_on_screen = 2      # up to this many more as the lane speeds up
unlocked_slowdown = 0.4  # unlocked words fall at this fraction of speed (time to punch)
target_depth = 0.4       # aim for words read + smashed this far down the screen (0 top, 1 floor):
                         # higher than this -> faster and more words, lower -> slower
pace_gain = 0.8          # how hard each smashed word pushes the speed
ease_down = 0.8          # a word that gets away: speed x this

[scoring]
read_target_s = 4.0      # reading faster than this earns up to 2x
punch_target_s = 3.0     # punching faster than this earns up to 1.5x
combo_step = 0.1         # +10% per combo, up to combo_max
combo_max = 10
